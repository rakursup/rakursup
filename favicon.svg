<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Градиент для акцента -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f90;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#206a9b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E72C98;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Задний слой (самый светлый/прозрачный) -->
  <rect x="20" y="20" width="50" height="60" rx="8" fill="#e0e0e0" opacity="0.3" />
  
  <!-- Средний слой -->
  <rect x="30" y="30" width="50" height="60" rx="8" fill="#b0b0b0" opacity="0.4" />
  
  <!-- Передний слой (акцентный) -->
  <rect x="40" y="40" width="50" height="60" rx="8" fill="url(#panelGrad)" opacity="0.9" stroke="white" stroke-width="2" />
</svg>